---
# The TLS certificate and key for the Molecule run are generated by prepare.yml in the scenario's
# ephemeral directory, nothing secret is committed. The role ships no default key, see defaults/main.yml.
vault_configuration_listeners:
  - address: 127.0.0.1:8200
    cluster_address: 127.0.0.1:8201
    http_idle_timeout: 5m
    http_read_header_timeout: 10s
    http_read_timeout: 30s
    http_write_timeout: "0"
    max_request_duration: 90s
    max_request_size: 33554432
    profiling:
      unauthenticated_in_flight_request_access: false
      unauthenticated_pprof_access: false
    proxy_protocol_authorized_addrs: ""
    proxy_protocol_behavior: ""
    telemetry:
      unauthenticated_metrics_access: false
    tls_cert_file: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault_tls.crt"
    tls_cipher_suites: ""
    tls_client_ca_file: ""
    tls_disable: false
    tls_disable_client_certs: false
    tls_key_file: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vault_tls.key"
    tls_min_version: tls12
    tls_require_and_verify_client_cert: false
    type: tcp
    x_forwarded_for_authorized_addrs: ""
    x_forwarded_for_hop_skips: 0
    x_forwarded_for_reject_not_authorized: true
    x_forwardesd_for_reject_not_present: true
  - address: /run/vault/vault.sock
    socket_group: vault
    socket_mode: "666"
    socket_user: vault
    type: unix
